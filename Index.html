<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keterisian Kamar - Kaura Bali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        kaura: {
                            50: '#F5F7F6', 100: '#E2EAE6', 200: '#C7D6CE', 500: '#527C67', 
                            600: '#406351', 700: '#2E493C', 800: '#1B2C24', 900: '#0E1712', 
                            gold: '#D4AF37', goldSoft: '#E6D7B8', goldHover: '#C49E2D', sand: '#F7F5F0'
                        }
                    },
                    boxShadow: {
                        premium: '0 8px 30px -4px rgba(27, 44, 36, 0.04), 0 2px 8px -1px rgba(27, 44, 36, 0.02)',
                        glow: '0 0 20px rgba(212, 175, 55, 0.25)',
                        cardHover: '0 20px 40px -10px rgba(27, 44, 36, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #F7F5F0; }
        ::-webkit-scrollbar-thumb { background: #C7D6CE; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #527C67; }
        .fade-in-card { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-kaura-sand text-slate-700 font-sans min-h-screen flex flex-col antialiased">

    <header class="bg-white/95 backdrop-blur-md text-slate-800 py-4 px-6 sticky top-0 z-50 border-b border-kaura-100 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <h1 class="text-lg font-extrabold text-kaura-800">KAURA BALI | OCCUPANCY HUB</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="sync-status" class="inline-flex items-center px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold uppercase">Connecting...</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <div id="error-banner" class="hidden bg-rose-50 border border-rose-200 text-rose-800 px-5 py-4 rounded-3xl">
            <p id="error-message"></p>
        </div>
        
        <div id="debug-logs" class="bg-black text-emerald-400 p-4 rounded-xl text-[10px] font-mono h-32 overflow-y-auto"></div>
    </main>

    <script>
        // --- KONFIGURASI BARU ---
        const csvSourceUrl = "/api/get-rooms"; // Memanggil API Vercel Anda
        
        const TODAY_YEAR = 2026;
        const TODAY_MONTH = 7;
        const TODAY_DAY = 10;
        let currentLang = 'ID';
        let rawDataset = [];
        let parsedDataset = [];

        // --- FUNGSI UTAMA (Pembaruan Sistem Fetch) ---
        function fetchData() {
            updateSyncStatus("Menghubungkan...", "amber");
            logDebug("Mengambil data melalui Vercel API...");

            fetch(csvSourceUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Gagal mengambil data");
                    return response.json(); 
                })
                .then(jsonData => {
                    logDebug("Sukses mengambil data JSON dari Vercel!");
                    
                    const headers = jsonData[0];
                    const rows = jsonData.slice(1);
                    
                    rawDataset = rows.map(row => {
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = row[i]);
                        return obj;
                    });
                    
                    updateSyncStatus("Tersambung", "emerald");
                    updateLastUpdated();
                    parseDataset(headers);
                })
                .catch(err => {
                    logDebug(`Error: ${err.message}`);
                    showDataError("Gagal mengambil data dari server perantara.");
                });
        }

        // --- Sisipkan semua fungsi asli Anda di bawah ini (parseDataset, applyFilters, dll) ---
        // ... (Fungsi-fungsi asli Anda) ...

        window.onload = function() {
            document.getElementById('debug-url').textContent = csvSourceUrl;
            changeLanguage('ID');
            fetchData(); // Panggil fungsi saat load
        };

        function logDebug(message) {
            const consoleBox = document.getElementById('debug-logs');
            consoleBox.innerHTML += `[LOG]: ${message}<br>`;
        }
        
        function updateSyncStatus(text, color) { /* Fungsi asli Anda */ }
        function updateLastUpdated() { /* Fungsi asli Anda */ }
        function showDataError(msg) { /* Fungsi asli Anda */ }
    </script>
</body>
</html>
